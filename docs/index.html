<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AmneziaWG Config Generator переехал на awgconfig.com</title>
    <!--
      Бывший лендинг на GitHub Pages конкурировал в выдаче с основным сайтом как дубль.
      Мгновенный meta refresh Google и Яндекс считают постоянным редиректом, а кросс-доменный
      canonical передаёт сигналы на https://awgconfig.com/.
    -->
    <link rel="canonical" href="https://awgconfig.com/" />
    <meta http-equiv="refresh" content="0; url=https://awgconfig.com/" />
    <script>
      window.location.replace('https://awgconfig.com/' + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>
      Генератор переехал: <a href="https://awgconfig.com/">awgconfig.com</a>.
      English version: <a href="https://awgconfig.com/en">awgconfig.com/en</a>.
    </p>
  </body>
</html>
