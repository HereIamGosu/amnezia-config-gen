# Installed as /etc/nginx/snippets/amnezia-proxy.conf. Included by every proxied location.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite (never append) client-supplied values: the app rate limiter trusts the
# leftmost X-Forwarded-For, so it must contain only the real peer address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# Slightly above the app's own deadline (vercel.json maxDuration = 60s) so the app answers first.
proxy_read_timeout 65s;
