# AmneziaWG Config Generator — reverse proxy to the container on 127.0.0.1:13100.
# Installed as /etc/nginx/sites-available/amnezia-web (symlinked into sites-enabled).
# Zones/log format below live in the http context; names are prefixed to avoid clashing
# with other vhosts on this shared host. Never add default_server here.
# Replace server_name and certificate paths when the permanent domain is attached.

# Per-client-IP limits ($binary_remote_addr = real peer, nginx is the edge).
# /api/warp: app allows 10/min; nginx is a slightly looser backstop against floods.
limit_req_zone $binary_remote_addr zone=amnezia_warp:10m rate=12r/m;
# /api/iplist: UI calls it (debounced) on every preset toggle.
limit_req_zone $binary_remote_addr zone=amnezia_iplist:10m rate=60r/m;
# /api/status, /api/healthcheck: cached server-side; UI polls once per minute per visible tab.
limit_req_zone $binary_remote_addr zone=amnezia_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=amnezia_conn:10m;

log_format amnezia '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name valokda-amnezia.185-77-219-233.sslip.io;
    server_tokens off;

    access_log /var/log/nginx/amnezia-web.access.log amnezia;
    error_log /var/log/nginx/amnezia-web.error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name valokda-amnezia.185-77-219-233.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/valokda-amnezia.185-77-219-233.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valokda-amnezia.185-77-219-233.sslip.io/privkey.pem;

    access_log /var/log/nginx/amnezia-web.access.log amnezia;
    error_log /var/log/nginx/amnezia-web.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn amnezia_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Same JSON shape as the app's own 429, so the frontend can parse it.
    error_page 429 = @amnezia_rate_limited;
    location @amnezia_rate_limited {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"message":"Слишком много запросов. Попробуйте позже."}';
    }

    location = /api/warp {
        limit_req zone=amnezia_warp burst=6 nodelay;
        proxy_pass http://127.0.0.1:13100;
        include /etc/nginx/snippets/amnezia-proxy.conf;
    }

    location = /api/iplist {
        limit_req zone=amnezia_iplist burst=30 nodelay;
        proxy_pass http://127.0.0.1:13100;
        include /etc/nginx/snippets/amnezia-proxy.conf;
    }

    location /api/ {
        limit_req zone=amnezia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:13100;
        include /etc/nginx/snippets/amnezia-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:13100;
        include /etc/nginx/snippets/amnezia-proxy.conf;
    }
}
