version: 2
updates:
  # Base image of deploy/Dockerfile (node:22-alpine@sha256:...). Dependabot keeps the
  # tag and refreshes the pinned digest; Node major upgrades are a deliberate decision.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
    open-pull-requests-limit: 2

  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    open-pull-requests-limit: 3
