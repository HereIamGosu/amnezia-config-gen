name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing by default; every job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job id stays `ci`: it is the status check name branch protection may require.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Deployment controller tests
        run: python3 -m unittest discover -s deploy/controller -p 'test_*.py' -v

      - name: Protocol evidence check
        run: npm run evidence:check

      - name: Release consistency check
        run: npm run release:check

      # public/static/* is cached for a year under ?v=<version>: changing it requires a
      # version bump. Base = PR base, or the previous main commit for a push.
      - name: Immutable asset version check
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo 'No base commit (new branch); nothing to compare.'
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-asset-version-bump.js "$BASE_SHA" HEAD

      - name: Tag version check
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-consistency.js --tag "$TAG"

      - name: presets-fallback drift check
        run: |
          cp public/static/presets-fallback.json "$RUNNER_TEMP/presets-fallback-before.json"
          npm run presets:fallback
          if ! diff -u "$RUNNER_TEMP/presets-fallback-before.json" public/static/presets-fallback.json > "$RUNNER_TEMP/presets-diff.txt"; then
            echo '::error::public/static/presets-fallback.json is out of date.'
            echo 'Run `npm run presets:fallback` and commit the result.'
            echo
            cat "$RUNNER_TEMP/presets-diff.txt"
            exit 1
          fi
          echo 'presets-fallback.json is up-to-date.'

      - name: Coverage (informational)
        run: |
          {
            echo '## Coverage report'
            echo
            echo '```'
            npm run test:coverage 2>&1 | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build image once, test that image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The publish job trusts these, not the artifact: only this job's own steps can set them.
    outputs:
      image_id: ${{ steps.record.outputs.image_id }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
      config_digest: ${{ steps.export.outputs.config_digest }}
    env:
      IMAGE: amnezia-web:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The only build. Everything below tests or exports this exact image.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          # The action would otherwise upload a build-record artifact on every run, PRs included.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deploy/Dockerfile
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          provenance: false

      - name: Record image ID
        id: record
        run: |
          docker image inspect -f '{{.Id}}' "$IMAGE" > "$RUNNER_TEMP/image-id.txt"
          echo "image_id=$(cat "$RUNNER_TEMP/image-id.txt")" >> "$GITHUB_OUTPUT"
          {
            echo '## Image'
            echo
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- image ID: \`$(cat "$RUNNER_TEMP/image-id.txt")\`"
            echo "- size: $(docker image inspect -f '{{.Size}}' "$IMAGE") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the built image
        run: bash scripts/ci/smoke-image.sh "$IMAGE" "$GITHUB_SHA"

      # Hand-off to the publish job: it checks this archive against the job outputs (sha256,
      # image ID, config digest from manifest.json) and pushes it — it never rebuilds.
      - name: Export tested image
        id: export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash # -eo pipefail: a failed docker save must fail the step
        run: |
          docker save "$IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"
          gzip -t "$RUNNER_TEMP/image.tar.gz"
          archive_sha256="$(sha256sum < "$RUNNER_TEMP/image.tar.gz" | cut -d' ' -f1)"
          config_digest="$(gzip -dc "$RUNNER_TEMP/image.tar.gz" | tar -xOf - manifest.json \
            | jq -r '.[0].Config' | sed -e 's#^blobs/sha256/##' -e 's#\.json$##' -e 's#^#sha256:#')"
          [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no config digest in the archive"; exit 1; }
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "config_digest=$config_digest" >> "$GITHUB_OUTPUT"
          echo "- archive sha256: \`$archive_sha256\`, config digest: \`$config_digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image.tar.gz
            ${{ runner.temp }}/image-id.txt
          retention-days: 7
          if-no-files-found: error

  # The only job with a write permission, and it never sees source code or builds anything:
  # it publishes the archive the image job tested. No deployment happens here.
  publish:
    name: Publish tested image to GHCR
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPO_IMAGE: ghcr.io/hereiamgosu/amnezia-config-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/image

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the tested image
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/image
          OUT_DIR: ${{ runner.temp }}/release
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.image.outputs.config_digest }}
          ALIAS: main
          MAIN_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/ci/publish-image.sh

      - name: Upload release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/release.json
          retention-days: 90
          if-no-files-found: error
